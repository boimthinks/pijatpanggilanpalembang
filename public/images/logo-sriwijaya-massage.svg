<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sriwijayaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background rounded squircle container -->
  <rect width="100" height="100" rx="24" fill="url(#sriwijayaGrad)" />

  <!-- Subtle glow inner circle -->
  <circle cx="50" cy="50" r="38" fill="white" fill-opacity="0.08" />

  <g filter="url(#subtleShadow)">
    <!-- Siluet Pilar Ampera Ikonik di bagian belakang atas -->
    <path d="M42 22 L45 22 L46 42 L42 42 Z M55 22 L58 22 L58 42 L54 42 Z" fill="white" fill-opacity="0.45" />
    <!-- Balok jembatan horizontal Ampera -->
    <rect x="39" y="30" width="22" height="2" rx="1" fill="white" fill-opacity="0.55" />
    <rect x="36" y="38" width="28" height="2.5" rx="1.2" fill="white" fill-opacity="0.65" />

    <!-- Daun Teratai Herbal / Lotus Wellness Pusat -->
    <!-- Kelopak Tengah -->
    <path d="M50 20 C46 29 46 38 50 46 C54 38 54 29 50 20 Z" fill="url(#goldGrad)" />
    <!-- Kelopak Kiri -->
    <path d="M50 32 C43 27 34 32 36 41 C40 46 47 46 50 46 Z" fill="white" fill-opacity="0.92" />
    <!-- Kelopak Kanan -->
    <path d="M50 32 C57 27 66 32 64 41 C60 46 53 46 50 46 Z" fill="white" fill-opacity="0.92" />

    <!-- Tetesan Minyak Esensial Keemasan di atas kuncup -->
    <circle cx="50" cy="18" r="2.8" fill="#fef08a" />

    <!-- Siluet Dua Tangan Terapi yang Menopang & Memijat Lembut -->
    <!-- Tangan Kiri -->
    <path d="M22 66 C22 55 31 51 38 53 C44 55 46 61 47 66 C42 66 37 68 33 72 C29 76 25 74 22 66 Z" fill="white" />
    <path d="M30 52 C35 48 43 51 46 56 C44 59 40 60 36 58 C32 56 30 54 30 52 Z" fill="white" fill-opacity="0.95" />

    <!-- Tangan Kanan -->
    <path d="M78 66 C78 55 69 51 62 53 C56 55 54 61 53 66 C58 66 63 68 67 72 C71 76 75 74 78 66 Z" fill="white" />
    <path d="M70 52 C65 48 57 51 54 56 C56 59 60 60 64 58 C68 56 70 54 70 52 Z" fill="white" fill-opacity="0.95" />

    <!-- Lekukan Dasar / Aliran Energi Gelombang Sungai Musi -->
    <path d="M28 78 C35 73 42 75 50 77 C58 79 65 77 72 78 C70 82 60 84 50 84 C40 84 30 82 28 78 Z" fill="white" fill-opacity="0.85" />
  </g>
</svg>
